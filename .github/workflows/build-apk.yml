name: Build ChatTranslate APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          rm -rf project
          mkdir project
          unzip -q ChatTranslate_Kazakh_Android_MVP.zip -d project

      - name: Find Android project
        run: |
          SETTINGS_FILE=$(find project -type f -name "settings.gradle" | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            SETTINGS_FILE=$(find project -type f -name "settings.gradle.kts" | head -n 1)
          fi

          if [ -z "$SETTINGS_FILE" ]; then
            echo "Android project not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Configure AndroidX
        run: |
          echo "android.useAndroidX=true" >> "$PROJECT_DIR/gradle.properties"
          echo "android.enableJetifier=true" >> "$PROJECT_DIR/gradle.properties"

      - name: Configure Java and Kotlin
        run: |
          APP_GRADLE=$(find "$PROJECT_DIR" -type f -path "*/app/build.gradle" | head -n 1)

          if [ -z "$APP_GRADLE" ]; then
            echo "app/build.gradle not found"
            exit 1
          fi

          echo "Using: $APP_GRADLE"

          printf '%s\n' \
          'tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {' \
          '    kotlinOptions.jvmTarget = "1.8"' \
          '}' \
          >> "$APP_GRADLE"

      - name: Fix OkHttp imports
        run: |
          IME_FILE=$(find "$PROJECT_DIR" -type f -name "TranslateIME.kt" | head -n 1)

          if [ -z "$IME_FILE" ]; then
            echo "TranslateIME.kt not found"
            exit 1
          fi

          echo "Using: $IME_FILE"

          sed -i '/import okhttp3.MediaType.Companion.toMediaType/d' "$IME_FILE"
          sed -i '/import okhttp3.RequestBody.Companion.toRequestBody/d' "$IME_FILE"

          sed -i '/import okhttp3.OkHttpClient/a import okhttp3.MediaType.Companion.toMediaType' "$IME_FILE"
          sed -i '/import okhttp3.MediaType.Companion.toMediaType/a import okhttp3.RequestBody.Companion.toRequestBody' "$IME_FILE"

      - name: Build APK
        run: |
          gradle -p "$PROJECT_DIR" assembleDebug --no-daemon

      - name: Find APK
        run: |
          APK=$(find "$PROJECT_DIR" -type f -name "app-debug.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK not found"
            exit 1
          fi

          echo "APK found: $APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChatTranslate-debug
          path: ${{ env.APK_PATH }}

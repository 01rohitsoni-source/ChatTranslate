name: Build ChatTranslate APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir project
          unzip -q ChatTranslate_Kazakh_Android_MVP.zip -d project

          SETTINGS_FILE=$(find project -name "gradle.properties" | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            PROJECT_DIR=$(find project -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1 | xargs dirname)
            SETTINGS_FILE="$PROJECT_DIR/gradle.properties"
            touch "$SETTINGS_FILE"
          fi

          echo "android.useAndroidX=true" >> "$SETTINGS_FILE"
          echo "android.enableJetifier=true" >> "$SETTINGS_FILE"

          echo "Using gradle.properties:"
          cat "$SETTINGS_FILE"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '15859902'

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Find Android project
        run: |
          SETTINGS_FILE=$(find project -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "Android Gradle project not found"
            find project -maxdepth 5 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project found at:"
          echo "$PROJECT_DIR"

      - name: Configure JVM 17
        run: |
          APP_GRADLE=$(find "$PROJECT_DIR" -path "*/app/build.gradle" | head -n 1)

          if [ -z "$APP_GRADLE" ]; then
            echo "app/build.gradle not found"
            find "$PROJECT_DIR" -type f
            exit 1
          fi

          cat >> "$APP_GRADLE" <<'EOF'

          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          echo "Updated:"
          cat "$APP_GRADLE"

      - name: Build APK
        run: |
          gradle -p "$PROJECT_DIR" assembleDebug --no-daemon

      - name: Find APK
        run: |
          APK=$(find "$PROJECT_DIR" -type f -name "app-debug.apk" | head

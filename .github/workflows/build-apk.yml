name: Build ChatTranslate APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        shell: bash
        run: |
          set -e
          rm -rf project
          mkdir project
          unzip -q ChatTranslate_Kazakh_Android_MVP.zip -d project

      - name: Find Android project
        shell: bash
        run: |
          set -e

          SETTINGS_FILE=$(find project -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "Android project not found"
            find project -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project found at:"
          echo "$PROJECT_DIR"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configure AndroidX
        shell: bash
        run: |
          touch "$PROJECT_DIR/gradle.properties"

          echo "android.useAndroidX=true" >> "$PROJECT_DIR/gradle.properties"
          echo "android.enableJetifier=true" >> "$PROJECT_DIR/gradle.properties"

      - name: Fix Kotlin and Java JVM target
        shell: bash
        run: |
          set -e

          APP_GRADLE=$(find "$PROJECT_DIR/app" -maxdepth 1 -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) | head -n 1)

          if [ -z "$APP_GRADLE" ]; then
            echo "app/build.gradle not found"
            exit 1
          fi

          cat >> "$APP_GRADLE" <<'EOF'

          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

      - name: Fix OkHttp imports
        shell: bash
        run: |
          set -e

          IME_FILE=$(find "$PROJECT_DIR" -type f -name "TranslateIME.kt" | head -n 1)

          if [ -z "$IME_FILE" ]; then
            echo "TranslateIME.kt not found"
            exit 1
          fi

          sed -i '/^import okhttp3\.\*$/a import okhttp3.MediaType.Companion.toMediaType' "$IME_FILE"
          sed -i '/^import okhttp3\.\*$/a import okhttp3.RequestBody.Companion.toRequestBody' "$IME_FILE"

          echo "Fixed OkHttp imports"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Starting APK build..."

          gradle assembleDebug --no-daemon --stacktrace

      - name: Find APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR" -type f -name "app-debug.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK NOT FOUND"
            find "$PROJECT_DIR" -type f
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChatTranslate-debug
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
